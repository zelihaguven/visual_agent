<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B71C1C"/>
    </marker>
    <style>
      .k  { stroke:#1E3A5F; stroke-width:1.4; }
      .no { font-size:20px; fill:#FFFFFF; font-weight:700; }
      .t  { font-size:15px; fill:#FFFFFF; font-weight:700; }
      .s  { font-size:12px; fill:#FFFFFF; }
      .r  { font-size:12.5px; fill:#B71C1C; }
      .rh { font-size:13px; fill:#B71C1C; font-weight:700; }
      .h  { font-size:14px; fill:#111827; font-weight:700; }
      .okr{ stroke:#B71C1C; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#ok); }
    </style>
  </defs>
  <rect x="0" y="0" width="1100" height="600" fill="#FFFFFF"/>

  <text x="40"  y="32" class="h">Katman (önlem)</text>
  <text x="790" y="32" class="h" fill="#B71C1C">Başarısız olursa</text>

  <!-- Huni: genişlik azalıyor -->
  <rect x="40"  y="50"  width="700" height="68" rx="8" fill="#1E3A5F" class="k"/>
  <text x="65" y="92" class="no">1</text>
  <text x="95" y="78" class="t">Doğru bilgiyi getirmek</text>
  <text x="95" y="98" class="s">metadata + yetki filtresi (marka, model, tür) · hibrit arama · rerank</text>

  <rect x="70"  y="128" width="640" height="68" rx="8" fill="#24507F" class="k"/>
  <text x="95" y="170" class="no">2</text>
  <text x="125" y="156" class="t">Eşik</text>
  <text x="125" y="176" class="s">en iyi skor test setiyle kalibre edilmiş eşiğin altındaysa LLM çağrılmaz</text>

  <rect x="100" y="206" width="580" height="68" rx="8" fill="#2B6299" class="k"/>
  <text x="125" y="248" class="no">3</text>
  <text x="155" y="234" class="t">Sıkı talimat</text>
  <text x="155" y="254" class="s">sadece kaynak · tolerans düşürülmez · birim dönüşümü yok · çelişki bildirilir</text>

  <rect x="130" y="284" width="520" height="68" rx="8" fill="#3474B3" class="k"/>
  <text x="155" y="326" class="no">4</text>
  <text x="185" y="312" class="t">Önce alıntı, sonra cevap</text>
  <text x="185" y="332" class="s">kelimesi kelimesine, kaynak dilinde · JSON şema</text>

  <rect x="160" y="362" width="460" height="68" rx="8" fill="#3F86C8" class="k"/>
  <text x="185" y="404" class="no">5</text>
  <text x="215" y="390" class="t">Otomatik doğrulama (kod)</text>
  <text x="215" y="410" class="s">kaynak no · alıntı eşleşmesi · iki yönlü sayı-tolerans</text>

  <rect x="190" y="440" width="400" height="68" rx="8" fill="#4F97D6" class="k"/>
  <text x="215" y="482" class="no">6</text>
  <text x="245" y="468" class="t">Kullanıcı doğrulaması</text>
  <text x="245" y="488" class="s">alıntı + vurgulu sayfa + rozet</text>

  <rect x="240" y="530" width="300" height="48" rx="24" fill="#2E7D32"/>
  <text x="390" y="560" text-anchor="middle" class="t">Doğrulanmış cevap → ekran + ses</text>

  <!-- Sağ taraf: başarısızlık -->
  <path d="M742,84 L780,84" class="okr"/>
  <text x="790" y="80" class="rh">Yanlış / eksik kaynak</text>
  <text x="790" y="97" class="r">katman 2–6 ve kullanıcı sayfada fark eder</text>

  <path d="M712,162 L780,162" class="okr"/>
  <text x="790" y="158" class="rh">"Bu bilgi manuellerde bulunamadı."</text>
  <text x="790" y="175" class="r">LLM hiç çağrılmaz</text>

  <path d="M682,240 L780,240" class="okr"/>
  <text x="790" y="236" class="rh">Kurala uymayan cevap</text>
  <text x="790" y="253" class="r">katman 5 yakalar</text>

  <path d="M652,318 L780,318" class="okr"/>
  <text x="790" y="314" class="rh">Alıntı kaynakta yok</text>
  <text x="790" y="331" class="r">1 tekrar → yine yoksa cevap gösterilmez</text>

  <path d="M622,396 L780,396" class="okr"/>
  <text x="790" y="384" class="rh">Kaynakta olmayan sayı → cevap gösterilmez</text>
  <text x="790" y="401" class="r">Tolerans düşmüş → ⚠ rozet + alıntı vurgusu</text>
  <text x="790" y="418" class="r">Tümü denetim izine yazılır</text>

  <path d="M592,474 L780,474" class="okr"/>
  <text x="790" y="470" class="rh">Kullanıcı uyuşmazlık görür</text>
  <text x="790" y="487" class="r">geri bildirim (👎 "yanlış değer") → inceleme</text>
</svg>
