<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .lok  { fill:#E6F4EA; stroke:#2E7D32; stroke-width:1.6; }
      .bul  { fill:#FFF1E0; stroke:#E65100; stroke-width:1.6; }
      .ara  { fill:#EEF2F7; stroke:#455A64; stroke-width:1.6; }
      .kul  { fill:#FFFFFF; stroke:#455A64; stroke-width:1.6; }
      .t    { font-size:14px; fill:#1F2937; font-weight:600; }
      .s    { font-size:11.5px; fill:#374151; }
      .h    { font-size:15px; fill:#111827; font-weight:700; }
      .n    { font-size:11.5px; fill:#B71C1C; font-style:italic; }
      .ok   { stroke:#374151; stroke-width:1.6; fill:none; marker-end:url(#ok); }
      .okk  { stroke:#B71C1C; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#ok); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#FFFFFF"/>

  <!-- 1. INGESTION -->
  <text x="20" y="35" class="h">1. Doküman işleme (ingestion) · doküman eklenirken bir kez</text>

  <rect x="20"  y="55" width="120" height="70" rx="8" class="kul"/>
  <text x="80" y="85" text-anchor="middle" class="t">PDF manuel</text>
  <text x="80" y="104" text-anchor="middle" class="s">dijital / taranmış</text>

  <rect x="165" y="55" width="175" height="70" rx="8" class="lok"/>
  <text x="252" y="82" text-anchor="middle" class="t">Ayrıştırma + OCR</text>
  <text x="252" y="101" text-anchor="middle" class="s">Docling · metin, tablo,</text>
  <text x="252" y="116" text-anchor="middle" class="s">şekil + sayfa no + bbox</text>

  <rect x="365" y="55" width="195" height="70" rx="8" class="lok"/>
  <text x="462" y="82" text-anchor="middle" class="t">Temizlik + şekil açıklaması</text>
  <text x="462" y="101" text-anchor="middle" class="s">üst/alt bilgi, birleştirme,</text>
  <text x="462" y="116" text-anchor="middle" class="s">çizimler için VLM açıklaması</text>

  <rect x="585" y="55" width="190" height="70" rx="8" class="lok"/>
  <text x="680" y="82" text-anchor="middle" class="t">Bölümleme + metadata</text>
  <text x="680" y="101" text-anchor="middle" class="s">başlık bazlı chunk · marka,</text>
  <text x="680" y="116" text-anchor="middle" class="s">model, tür, sayfa, bbox</text>

  <rect x="800" y="55" width="170" height="70" rx="8" class="lok"/>
  <text x="885" y="82" text-anchor="middle" class="t">Embedding</text>
  <text x="885" y="101" text-anchor="middle" class="s">bge-m3 (çok dilli)</text>
  <text x="885" y="116" text-anchor="middle" class="s">dense + sparse vektör</text>

  <line x1="140" y1="90" x2="163" y2="90" class="ok"/>
  <line x1="340" y1="90" x2="363" y2="90" class="ok"/>
  <line x1="560" y1="90" x2="583" y2="90" class="ok"/>
  <line x1="775" y1="90" x2="798" y2="90" class="ok"/>
  <line x1="970" y1="90" x2="1008" y2="90" class="ok"/>

  <!-- VEKTÖR DB -->
  <rect x="1010" y="55" width="170" height="260" rx="10" class="lok"/>
  <ellipse cx="1095" cy="55" rx="85" ry="12" class="lok"/>
  <text x="1095" y="140" text-anchor="middle" class="t">Vektör veritabanı</text>
  <text x="1095" y="160" text-anchor="middle" class="s">Qdrant</text>
  <text x="1095" y="190" text-anchor="middle" class="s">chunk metni + vektörler</text>
  <text x="1095" y="207" text-anchor="middle" class="s">+ metadata</text>
  <text x="1095" y="235" text-anchor="middle" class="s">yetki filtresi</text>
  <text x="1095" y="252" text-anchor="middle" class="s">aramadan ÖNCE</text>

  <!-- 2. SORGU -->
  <text x="20" y="190" class="h">2. Sorgu · her soruda</text>

  <rect x="20" y="210" width="120" height="70" rx="8" class="kul"/>
  <text x="80" y="238" text-anchor="middle" class="t">Soru</text>
  <text x="80" y="257" text-anchor="middle" class="s">yazı veya ses</text>
  <text x="80" y="272" text-anchor="middle" class="s">(STT, onaylı)</text>

  <rect x="165" y="210" width="215" height="70" rx="8" class="lok"/>
  <text x="272" y="238" text-anchor="middle" class="t">Sorgu analizi + yetki</text>
  <text x="272" y="257" text-anchor="middle" class="s">marka, model, dil, doküman türü</text>
  <text x="272" y="272" text-anchor="middle" class="s">∩ kullanıcının izinli markaları</text>

  <rect x="405" y="210" width="215" height="70" rx="8" class="lok"/>
  <text x="512" y="238" text-anchor="middle" class="t">Hibrit arama</text>
  <text x="512" y="257" text-anchor="middle" class="s">anlamsal (dense) + kelime</text>
  <text x="512" y="272" text-anchor="middle" class="s">(BM25 / sparse) · ~30 aday</text>

  <line x1="140" y1="245" x2="163" y2="245" class="ok"/>
  <line x1="380" y1="245" x2="403" y2="245" class="ok"/>
  <line x1="620" y1="245" x2="1008" y2="245" class="ok"/>

  <!-- Satır 3: sağdan sola -->
  <rect x="1010" y="360" width="170" height="75" rx="8" class="lok"/>
  <text x="1095" y="388" text-anchor="middle" class="t">Rerank + eşik</text>
  <text x="1095" y="407" text-anchor="middle" class="s">bge-reranker-v2-m3</text>
  <text x="1095" y="423" text-anchor="middle" class="s">en iyi 3–5 parça</text>
  <line x1="1095" y1="315" x2="1095" y2="358" class="ok"/>

  <rect x="770" y="360" width="210" height="75" rx="8" class="bul"/>
  <text x="875" y="388" text-anchor="middle" class="t">LLM</text>
  <text x="875" y="407" text-anchor="middle" class="s">önce alıntı, sonra cevap [n]</text>
  <text x="875" y="423" text-anchor="middle" class="s">JSON şema · sesli metin alanı</text>
  <line x1="1010" y1="397" x2="982" y2="397" class="ok"/>

  <rect x="530" y="360" width="210" height="75" rx="8" class="lok"/>
  <text x="635" y="388" text-anchor="middle" class="t">Otomatik doğrulama</text>
  <text x="635" y="407" text-anchor="middle" class="s">kaynak no · birebir alıntı</text>
  <text x="635" y="423" text-anchor="middle" class="s">iki yönlü sayı-tolerans</text>
  <line x1="770" y1="397" x2="742" y2="397" class="ok"/>

  <rect x="290" y="360" width="210" height="75" rx="8" class="lok"/>
  <text x="395" y="388" text-anchor="middle" class="t">Sesli metin hazırlığı</text>
  <text x="395" y="407" text-anchor="middle" class="s">sayı, tolerans, kod, birim</text>
  <text x="395" y="423" text-anchor="middle" class="s">→ okunacak kelimeler</text>
  <line x1="530" y1="397" x2="502" y2="397" class="ok"/>

  <rect x="20" y="360" width="240" height="75" rx="8" class="bul"/>
  <text x="140" y="388" text-anchor="middle" class="t">TTS (metinden sese)</text>
  <text x="140" y="407" text-anchor="middle" class="s">doğrulanmış metin, cümle cümle</text>
  <text x="140" y="423" text-anchor="middle" class="s">streaming</text>
  <line x1="290" y1="397" x2="262" y2="397" class="ok"/>

  <!-- Bulunamadı dalı -->
  <path d="M1060,435 L1060,470" class="okk"/>
  <text x="1068" y="490" text-anchor="end" class="n">eşik altı → "Bulunamadı"</text>
  <text x="880" y="456" text-anchor="middle" class="n">doğrulama başarısız → 1 tekrar, sonra uyarı / red</text>

  <!-- 4. ARAYÜZ -->
  <text x="20" y="525" class="h">3. Ekran · tek görünüm</text>
  <rect x="20" y="540" width="960" height="110" rx="10" class="ara"/>

  <rect x="40" y="560" width="290" height="72" rx="6" class="kul"/>
  <text x="185" y="585" text-anchor="middle" class="t">Cevap + doğrulama rozeti</text>
  <text x="185" y="604" text-anchor="middle" class="s">✔ / ⚠ / ✖ · kritik değer büyük punto</text>
  <text x="185" y="620" text-anchor="middle" class="s">orijinal alıntı · kaynak [n]</text>

  <rect x="350" y="560" width="330" height="72" rx="6" class="kul"/>
  <text x="515" y="585" text-anchor="middle" class="t">Kaynak sayfa + vurgu</text>
  <text x="515" y="604" text-anchor="middle" class="s">PDF.js · bbox vurgusu · gezinme</text>
  <text x="515" y="620" text-anchor="middle" class="s">"s.90 (PDF s.101)"</text>

  <rect x="700" y="560" width="260" height="72" rx="6" class="kul"/>
  <text x="830" y="585" text-anchor="middle" class="t">Ses oynatıcı</text>
  <text x="830" y="604" text-anchor="middle" class="s">oynat · tekrar · yavaş</text>
  <text x="830" y="620" text-anchor="middle" class="s">butonla başlar</text>

  <rect x="1010" y="560" width="170" height="72" rx="8" class="lok"/>
  <text x="1095" y="588" text-anchor="middle" class="t">Denetim izi</text>
  <text x="1095" y="607" text-anchor="middle" class="s">soru, kaynaklar, skorlar,</text>
  <text x="1095" y="622" text-anchor="middle" class="s">doğrulama sonucu</text>

  <path d="M600,435 L600,500 L185,500 L185,558" class="ok"/>
  <path d="M670,435 L670,500 L515,500 L515,558" class="ok"/>
  <path d="M140,435 L140,470 L830,470 L830,558" class="ok"/>
  <path d="M1140,435 L1140,558" class="ok" stroke-dasharray="3 3"/>
  <text x="1150" y="505" class="s">tüm</text>
  <text x="1150" y="520" class="s">adımlar</text>

  <!-- Lejant -->
  <rect x="20" y="672" width="22" height="16" rx="3" class="lok"/>
  <text x="50" y="685" class="s">Kurum içinde (lokal)</text>
  <rect x="200" y="672" width="22" height="16" rx="3" class="bul"/>
  <text x="230" y="685" class="s">Bulut (önerilen hibrit senaryoda kurumsal sözleşme + veri saklamama) · Q1'e göre lokal de olabilir</text>
  <rect x="860" y="672" width="22" height="16" rx="3" class="ara"/>
  <text x="890" y="685" class="s">Kullanıcı ekranı</text>
</svg>
